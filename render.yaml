services:
  # Бэкенд (NestJS)
  - type: web
    name: kotloff-backend
    runtime: image
    repo: https://github.com/valerahthfthfh/WebSite
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: NODE_ENV
        value: production

  # Фронтенд (React)
  - type: web
    name: kotloff-frontend
    runtime: image
    repo: https://github.com/valerahthfthfh/WebSite
    dockerfilePath: ./react-app/Dockerfile
    dockerContext: ./react-app
    envVars:
      - key: REACT_APP_API_URL
        value: https://kotloff-backend.onrender.com